name: Deploy website

# Build and publish website/ to GitHub Pages on every push to main that
# touches the site (or this workflow). The PR-side check lives in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-flight Pages deploy mid-upload.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website
      # dist/ includes public/CNAME (dashfloat.com), which Pages reads to
      # bind the custom domain; the www redirect is DNS + Pages settings.
      - run: npm run build
        working-directory: website

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
